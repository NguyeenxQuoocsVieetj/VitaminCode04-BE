spring.application.name=vitamincode04
server.port=8888
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#Config Securities
mybatis.mapper-locations=classpath:/static/mapper/*.xml
mybatis.type-aliases-package=org.example.vitamincode04.entity
#Config SQL Logging
logging.level.com.baeldung.mybatis.spring.ArticleMapper=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show_sql=true

spring.config.import=optional:file:.env[.properties]